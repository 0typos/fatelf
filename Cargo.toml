[package]
name = "fatelf"
version = "0.2.0-beta.3"
edition = "2024"
rust-version = "1.99"
license = "MIT"
description = "Build selectable, byte-exact Linux ELF containers"
publish = false
default-run = "fatelf"

[features]
default = ["builder", "compression", "encryption"]
builder = ["compression", "encryption", "zstandard", "dep:clap", "dep:color-eyre", "dep:crossterm", "dep:ratatui", "dep:toml", "dep:unicode-width"]
compression = ["dep:lz4_flex"]
encryption = ["dep:chacha20poly1305", "dep:getrandom", "dep:zeroize"]
zstandard = ["dep:zstd"]
# Rust SIMD intrinsics keep x86 launchers smaller than native assembly/AVX-512.
compact-hash = ["blake3/pure"]
fuzzing = ["builder"]

[dependencies]
bnb = { package = "bitsandbytes", version = "=0.7.1", default-features = false }
blake3 = "1.8"
clap = { version = "4.6", optional = true, default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
color-eyre = { version = "0.6", optional = true, default-features = false }
crossterm = { version = "0.29", optional = true }
chacha20poly1305 = { version = "=0.11.0", optional = true, default-features = false, features = ["alloc", "zeroize"] }
getrandom = { version = "0.4", optional = true }
lz4_flex = { version = "=0.14.0", optional = true, default-features = false, features = ["std", "safe-encode", "safe-decode", "checked-decode"] }
object = { version = "0.37", default-features = false, features = ["read_core", "elf", "std"] }
libc = "0.2"
ratatui = { version = "0.30", optional = true, default-features = false, features = ["crossterm_0_29"] }
rustix = { version = "1.1", features = ["fs", "process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
toml = { version = "1.1", optional = true }
unicode-width = { version = "0.2", optional = true }
zeroize = { version = "1.8", optional = true }
zstd = { version = "=0.13.5", default-features = false, optional = true }

[profile.release]
lto = "thin"
strip = true

[profile.launcher]
inherits = "release"
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"

[[bin]]
name = "fatelf"
path = "src/main.rs"
required-features = ["builder"]

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
